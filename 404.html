<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>找不到页面 · Hia</title>
    <meta name="description" content="这个地址下没有页面。回到 Hia 的个人主页，或者直接去看项目。" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f8f3ea" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body class="page-404">
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="site-header">
      <div class="wrap site-header__inner">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__text">Hia</span>
        </a>

        <nav class="nav" aria-label="站点导航">
          <a href="/#projects">项目</a>
          <a href="/#notes">关于</a>
          <a href="https://github.com/hiack" target="_blank" rel="noopener noreferrer">
            GitHub<span class="ext" aria-hidden="true">↗</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="err" id="main">
      <div class="wrap">
        <p class="err__code">404</p>
        <h1 class="err__title">这个地址下没有页面</h1>
        <p class="err__body">
          可能是链接过期了，或者地址打错了一个字母。首页和两个项目都还在，从下面任选一个都能回去。
        </p>

        <div class="err__actions">
          <a class="btn btn--primary" href="/">回到首页</a>
          <a class="btn btn--ghost" href="/#projects">看项目</a>
          <a class="btn btn--ghost" href="https://github.com/hiack" target="_blank" rel="noopener noreferrer">
            GitHub 主页<span class="ext" aria-hidden="true">↗</span>
          </a>
        </div>

        <p class="quick__hint">带 ↗ 的链接会在新标签页打开。</p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap footer__inner">
        <div class="footer__brand">
          <p class="footer__name">Hia<span class="brand__dot" aria-hidden="true"></span></p>
          <p class="footer__domain">tangzhaochu.com</p>
        </div>
        <p class="footer__meta">纯静态页面，不加载任何外部资源。</p>
      </div>
    </footer>
  </body>
</html>
